[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eti-core"
version = "0.1.0"
description = "Core framework forense ETI — traceroute SMTP, enriquecimiento ASN/WHOIS, scoring ETI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luis Valdenegro" }]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "ipwhois>=1.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
eti = "eti_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eti_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
